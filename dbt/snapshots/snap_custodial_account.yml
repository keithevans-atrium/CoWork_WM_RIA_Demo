snapshots:
  - name: snap_custodial_account
    description: "SCD Type 2 history for custodial account changes (status, rep code, branch, margin/options)"
    relation: ref('raw_custodial_account')
    config:
      schema: SNAPSHOTS
      unique_key: record_pk
      strategy: check
      check_cols:
        - change_key
      hard_deletes: new_record
