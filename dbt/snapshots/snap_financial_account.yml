snapshots:
  - name: snap_financial_account
    description: "SCD Type 2 history for financial account changes (balance, model, fee rate, status)"
    relation: ref('raw_financial_account')
    config:
      schema: SNAPSHOTS
      unique_key: record_pk
      strategy: check
      check_cols:
        - change_key
      hard_deletes: new_record
