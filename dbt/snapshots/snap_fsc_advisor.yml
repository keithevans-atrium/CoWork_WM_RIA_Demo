snapshots:
  - name: snap_fsc_advisor
    description: "SCD Type 2 history for advisor changes (role, branch, CRD, active status)"
    relation: ref('raw_advisor')
    config:
      schema: SNAPSHOTS
      unique_key: record_pk
      strategy: check
      check_cols:
        - change_key
      hard_deletes: new_record
