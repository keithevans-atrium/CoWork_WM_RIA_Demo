version: 2

models:
  - name: dim_client
    description: "Client dimension - one row per household/account with primary contact, advisor, and team info"
    columns:
      - name: client_key
        tests: [unique, not_null]
      - name: client_segment
        tests:
          - accepted_values:
              values: ['UHNW', 'HNW', 'Mass Affluent', 'Emerging']

  - name: dim_advisor
    description: "Advisor dimension with team assignment, book metrics (client count, AUM)"
    columns:
      - name: advisor_key
        tests: [unique, not_null]

  - name: dim_account
    description: "Account dimension - financial account with custodian, performance, and cash details"
    columns:
      - name: account_key
        tests: [unique, not_null]

  - name: dim_security
    description: "Security master - deduplicated security reference by ticker"
    columns:
      - name: security_key
        tests: [unique, not_null]

  - name: fct_portfolio_return
    description: "Monthly portfolio returns with benchmark comparison and excess return calculations"
    columns:
      - name: return_id
        tests: [unique, not_null]

  - name: fct_transaction
    description: "All custodian transactions (buys, sells, dividends, fees, transfers) with cost detail"

  - name: fct_fee_billing
    description: "Quarterly fee billing records with annualized fee calculation"

  - name: agg_aum_summary
    description: "AUM summary aggregated by advisor, team, region, and client segment"
