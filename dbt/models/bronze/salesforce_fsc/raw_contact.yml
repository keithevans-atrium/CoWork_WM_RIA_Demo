version: 2
models:
  - name: raw_contact
    description: "Raw Salesforce FSC Contact records. Represents individuals linked to accounts — includes demographics, employment, risk profile, and investment experience. Primary contacts are the main point of contact for the household."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from contact_id"
        tests: [unique, not_null]
      - name: contact_id
        description: "Salesforce 18-character Contact ID. Natural primary key."
        tests: [unique, not_null]
      - name: account_id
        description: "Salesforce Account ID linking this contact to a client household. Foreign key to ACCOUNT."
        tests:
          - not_null
          - relationships:
              to: ref('raw_account')
              field: account_id
      - name: first_name
        description: "Contact's first/given name"
      - name: last_name
        description: "Contact's last/family name"
      - name: full_name
        description: "Concatenated first_name + last_name for display"
      - name: email
        description: "Contact's personal email address"
      - name: phone
        description: "Contact's primary phone number"
      - name: mobile_phone
        description: "Contact's mobile phone number"
      - name: mailing_state
        description: "Two-letter US state code from the mailing address"
      - name: mailing_city
        description: "City from the mailing address"
      - name: mailing_zip
        description: "ZIP/postal code from the mailing address"
      - name: date_of_birth
        description: "Contact's date of birth. Used for RMD calculations and suitability."
      - name: ssn_last_four
        description: "Last four digits of SSN. Used for identity verification only."
      - name: employment_status
        description: "Current employment status: Employed, Self-Employed, Retired, or Business Owner"
      - name: employer_name
        description: "Name of current employer. NULL for retired contacts."
      - name: occupation
        description: "Professional occupation: Executive, Engineer, Physician, Attorney, Business Owner, or Consultant"
      - name: risk_tolerance
        description: "Client's stated risk tolerance for investments: Conservative, Moderate, Moderate Growth, Growth, or Aggressive"
        tests:
          - accepted_values:
              values: ['Conservative', 'Moderate', 'Moderate Growth', 'Growth', 'Aggressive']
      - name: investment_experience
        description: "Self-reported investment knowledge level: Beginner, Intermediate, Experienced, or Sophisticated"
      - name: is_primary_contact
        description: "Whether this is the primary contact for the account (true/false). Only one primary per account."
      - name: created_date
        description: "Timestamp when the record was created in Salesforce"
      - name: last_modified_date
        description: "Timestamp of the most recent modification in Salesforce"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'CONTACT'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
