version: 2
models:
  - name: raw_contact
    description: "Salesforce FSC Contact - people linked to accounts with demographics and risk profile"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of contact_id)"
        tests: [unique, not_null]
      - name: contact_id
        description: "Salesforce Contact ID (natural key)"
        tests: [unique, not_null]
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('raw_account')
              field: account_id
      - name: risk_tolerance
        tests:
          - accepted_values:
              values: ['Conservative', 'Moderate', 'Moderate Growth', 'Growth', 'Aggressive']
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
