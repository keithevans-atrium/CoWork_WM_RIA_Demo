version: 2
models:
  - name: raw_advisor
    description: "Salesforce FSC Advisor - financial advisors with CRD, rep code, branch"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of advisor_id)"
        tests: [unique, not_null]
      - name: advisor_id
        description: "Salesforce Advisor ID (natural key)"
        tests: [unique, not_null]
      - name: role
        tests:
          - accepted_values:
              values: ['Lead Advisor', 'Associate Advisor', 'Senior Advisor', 'Paraplanner']
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
