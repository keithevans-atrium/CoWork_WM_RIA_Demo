version: 2
models:
  - name: brz_opportunity
    description: "Salesforce FSC Opportunity - sales pipeline (new assets, rollovers, referrals)"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of opportunity_id)"
        tests: [unique, not_null]
      - name: opportunity_id
        description: "Salesforce Opportunity ID (natural key)"
        tests: [unique, not_null]
      - name: account_id
        tests:
          - relationships:
              to: ref('brz_account')
              field: account_id
      - name: stage
        tests:
          - accepted_values:
              values: ['Prospecting', 'Discovery', 'Proposal', 'Negotiation', 'Closed Won', 'Closed Lost']
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
