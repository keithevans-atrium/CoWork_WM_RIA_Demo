version: 2
models:
  - name: raw_opportunity
    description: "Raw Salesforce FSC Opportunity records. Represents sales pipeline items — new accounts, rollovers, plan conversions, and additional investments. Tracks stage progression, probability, and expected revenue for AUM growth forecasting."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from opportunity_id"
        tests: [unique, not_null]
      - name: opportunity_id
        description: "Salesforce 18-character Opportunity ID. Natural primary key."
        tests: [unique, not_null]
      - name: account_id
        description: "Salesforce Account ID of the prospective or existing client. Foreign key to ACCOUNT."
        tests:
          - relationships:
              to: ref('raw_account')
              field: account_id
      - name: contact_id
        description: "Salesforce Contact ID of the primary person associated with this opportunity"
      - name: opportunity_name
        description: "Display name describing the opportunity (e.g. 'Smith - IRA Rollover')"
      - name: stage
        description: "Pipeline stage: Prospecting, Discovery, Proposal, Negotiation, Closed Won, or Closed Lost"
        tests:
          - accepted_values:
              values: ['Prospecting', 'Discovery', 'Proposal', 'Negotiation', 'Closed Won', 'Closed Lost']
      - name: opportunity_type
        description: "Category of the opportunity: New Account, Additional Investment, Rollover, or Plan Conversion"
      - name: amount
        description: "Expected total value of the opportunity in USD"
      - name: expected_revenue
        description: "Probability-weighted expected revenue (amount * probability)"
      - name: close_date
        description: "Projected or actual close date"
      - name: probability
        description: "Win probability as a percentage (0-100). Auto-set by stage in Salesforce."
      - name: lead_source
        description: "Origin of the lead: Referral, Website, Seminar, COI Introduction, or Existing Client"
      - name: advisor_id
        description: "Salesforce Advisor ID of the assigned advisor. Foreign key to ADVISOR."
        tests:
          - relationships:
              to: ref('raw_advisor')
              field: advisor_id
      - name: created_date
        description: "Timestamp when the opportunity was created in Salesforce"
      - name: last_modified_date
        description: "Timestamp of the most recent modification in Salesforce"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'OPPORTUNITY'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
