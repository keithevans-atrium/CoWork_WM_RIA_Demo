version: 2
models:
  - name: raw_account
    description: "Salesforce FSC Account - households, individuals, trusts, businesses"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of account_id)"
        tests: [unique, not_null]
      - name: account_id
        description: "Salesforce Account ID (natural key)"
        tests: [unique, not_null]
      - name: account_name
        tests: [not_null]
      - name: account_type
        tests:
          - accepted_values:
              values: ['Individual', 'Household', 'Joint', 'Trust', 'Business']
      - name: client_segment
        tests:
          - accepted_values:
              values: ['UHNW', 'HNW', 'Mass Affluent', 'Emerging']
      - name: advisor_id
        tests:
          - relationships:
              to: ref('raw_advisor')
              field: advisor_id
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
