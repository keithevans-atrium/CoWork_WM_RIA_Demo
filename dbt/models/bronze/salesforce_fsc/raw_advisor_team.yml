version: 2
models:
  - name: raw_advisor_team
    description: "Raw Salesforce FSC Advisor Team records. Represents organizational groupings of advisors into teams with a designated lead. Used for production reporting, branch management, and team-level AUM rollups."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from team_id"
        tests: [unique, not_null]
      - name: team_id
        description: "Salesforce 18-character Team ID. Natural primary key."
        tests: [unique, not_null]
      - name: team_name
        description: "Display name of the team (e.g. 'West Coast Advisory', 'Smith & Associates')"
      - name: team_lead_advisor_id
        description: "Salesforce Advisor ID of the team lead. Foreign key to ADVISOR."
        tests:
          - relationships:
              to: ref('raw_advisor')
              field: advisor_id
      - name: branch_name
        description: "Branch office associated with the team"
      - name: region
        description: "Geographic region: West, East, Central, or Southeast"
      - name: is_active
        description: "Whether the team is currently active (true/false)"
      - name: created_date
        description: "Timestamp when the record was created in Salesforce"
      - name: last_modified_date
        description: "Timestamp of the most recent modification in Salesforce"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'ADVISOR_TEAM'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
