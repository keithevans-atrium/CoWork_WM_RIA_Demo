version: 2
models:
  - name: brz_benchmark
    description: "Benchmark definitions - index, blended, custom"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of benchmark_id)"
        tests: [unique, not_null]
      - name: benchmark_id
        description: "Benchmark ID (natural key)"
        tests: [unique, not_null]
      - name: benchmark_type
        tests:
          - accepted_values:
              values: ['Index', 'Blended', 'Custom']
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
