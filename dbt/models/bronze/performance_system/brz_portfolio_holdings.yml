version: 2
models:
  - name: brz_portfolio_holdings
    description: "Current security-level holdings per account with cost basis and unrealized P&L"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of holding_id)"
        tests: [unique, not_null]
      - name: holding_id
        description: "Holding record ID (natural key)"
        tests: [unique, not_null]
      - name: account_number
        tests:
          - not_null
          - relationships:
              to: ref('brz_perf_account')
              field: account_number
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
