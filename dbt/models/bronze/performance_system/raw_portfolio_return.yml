version: 2
models:
  - name: raw_portfolio_return
    description: "Raw Performance System portfolio return records. Contains time-weighted return calculations across multiple periods (MTD, QTD, YTD, 1/3/5-year, ITD) alongside benchmark comparisons. One row per account per reporting date."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from return_id"
        tests: [unique, not_null]
      - name: return_id
        description: "Unique return record identifier from the performance system"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: portfolio_id
        description: "Portfolio identifier within the performance system"
      - name: as_of_date
        description: "Reporting date for this return snapshot"
      - name: mtd_return
        description: "Month-to-date return as a decimal (e.g. 0.0125 = 1.25%)"
      - name: qtd_return
        description: "Quarter-to-date return as a decimal"
      - name: ytd_return
        description: "Year-to-date return as a decimal"
      - name: itd_return
        description: "Inception-to-date (since account open) return as a decimal"
      - name: one_year_return
        description: "Trailing one-year annualized return as a decimal"
      - name: three_year_return
        description: "Trailing three-year annualized return as a decimal. NULL if account is less than 3 years old."
      - name: five_year_return
        description: "Trailing five-year annualized return as a decimal. NULL if account is less than 5 years old."
      - name: benchmark_id
        description: "Identifier of the assigned benchmark for relative performance comparison"
      - name: benchmark_mtd_return
        description: "Benchmark month-to-date return for comparison"
      - name: benchmark_ytd_return
        description: "Benchmark year-to-date return for comparison"
      - name: benchmark_one_year_return
        description: "Benchmark trailing one-year return for comparison"
      - name: return_method
        description: "Return calculation methodology: TWR (time-weighted) or MWR (money-weighted)"
      - name: loaded_at
        description: "Source system load timestamp from PERFORMANCE_SYSTEM schema"
      - name: _source_system
        description: "Source system identifier: 'performance_system'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'PORTFOLIO_RETURN'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
