version: 2
models:
  - name: raw_portfolio_return
    description: "Monthly TWR/IRR portfolio returns vs benchmark"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of return_id)"
        tests: [unique, not_null]
      - name: return_id
        description: "Return record ID (natural key)"
        tests: [unique, not_null]
      - name: account_number
        tests:
          - not_null
          - relationships:
              to: ref('raw_perf_account')
              field: account_number
      - name: as_of_date
        tests: [not_null]
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
