version: 2
models:
  - name: raw_perf_account
    description: "Performance System Account - performance-tracked accounts with model and custodian linkage"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of account_number)"
        tests: [unique, not_null]
      - name: account_number
        description: "Account number (natural key, links to custodian)"
        tests: [unique, not_null]
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
