version: 2
models:
  - name: raw_portfolio_holdings
    description: "Raw Performance System portfolio holdings records. Point-in-time security-level positions with market values, cost basis, and unrealized gains. Used for asset allocation analysis, sector exposure, and portfolio construction reporting."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from holding_id"
        tests: [unique, not_null]
      - name: holding_id
        description: "Unique holding record identifier from the performance system"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: portfolio_id
        description: "Portfolio identifier within the performance system"
      - name: as_of_date
        description: "Date the holding snapshot was taken"
      - name: security_id
        description: "Performance system internal security identifier"
      - name: ticker
        description: "Exchange ticker symbol (e.g. 'AAPL', 'SPY')"
      - name: cusip
        description: "CUSIP identifier (9-character alphanumeric). Standard security identifier for clearing."
      - name: security_description
        description: "Human-readable name of the security (e.g. 'Apple Inc', 'Vanguard S&P 500 ETF')"
      - name: asset_class
        description: "Broad asset classification: US Equity, International Equity, Fixed Income, Alternatives, or Cash"
      - name: sector
        description: "Industry sector: Technology, Healthcare, Financials, Consumer, Energy, Industrials, or Other"
      - name: quantity
        description: "Number of shares or units held"
      - name: market_value
        description: "Current market value in USD (quantity * price)"
      - name: cost_basis
        description: "Original purchase cost in USD for tax lot tracking"
      - name: unrealized_gain_loss
        description: "Unrealized gain or loss in USD (market_value - cost_basis)"
      - name: weight_pct
        description: "Position weight as a percentage of total portfolio value (0-100)"
      - name: loaded_at
        description: "Source system load timestamp from PERFORMANCE_SYSTEM schema"
      - name: _source_system
        description: "Source system identifier: 'performance_system'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'PORTFOLIO_HOLDINGS'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
