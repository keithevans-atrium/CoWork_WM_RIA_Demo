version: 2
models:
  - name: brz_custodial_account
    description: "Custodial account registrations with rep code, branch, margin/options status"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of account_number)"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodial account number (natural key)"
        tests: [unique, not_null]
      - name: custodian_code
        tests:
          - not_null
          - accepted_values:
              values: ['SCHW', 'PERS', 'FIDL']
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
