version: 2
models:
  - name: raw_fee_billing
    description: "Raw Custodian fee billing records. Advisory fee calculations per billing period — billable AUM, fee rates, computed amounts, and debit dates. Used for revenue recognition, fee reconciliation, and billing disputes."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from fee_id"
        tests: [unique, not_null]
      - name: fee_id
        description: "Custodian's unique fee billing record identifier"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: billing_period_start
        description: "Start date of the billing period (typically quarter start)"
      - name: billing_period_end
        description: "End date of the billing period (typically quarter end)"
      - name: fee_type
        description: "Type of fee: Management, Performance, Financial Planning, or Custody"
      - name: billable_aum
        description: "AUM used as the fee calculation base in USD"
      - name: fee_rate
        description: "Annualized fee rate as a decimal (e.g. 0.0100 = 1.00%). Prorated by period."
      - name: fee_amount
        description: "Calculated fee amount in USD for this billing period"
      - name: debit_date
        description: "Date the fee was or will be debited from the account"
      - name: status
        description: "Billing status: Calculated, Debited, or Reversed"
      - name: loaded_at
        description: "Source system load timestamp from CUSTODIAN schema"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'FEE_BILLING'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
