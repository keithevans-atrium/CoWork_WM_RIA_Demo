version: 2
models:
  - name: raw_custodial_account
    description: "Raw Custodian account records. Represents the custodian's official view of investment accounts — registration details, rep codes, margin approvals, and options levels. Joined to FSC and Performance via account_number."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from custodial_account_id"
        tests: [unique, not_null]
      - name: custodial_account_id
        description: "Custodian's internal account identifier. Natural primary key."
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key to FSC and Performance."
      - name: account_title
        description: "Legal account title on the custodian's records (e.g. 'John Smith IRA')"
      - name: registration_type
        description: "Legal registration: Individual, Joint, Trust, or Custodial"
      - name: tax_id_last_four
        description: "Last four digits of the account's tax ID (SSN or EIN) for verification"
      - name: custodian_code
        description: "Custodian identifier: SCHWAB, PERSHING, or FIDELITY"
      - name: rep_code
        description: "Advisor representative code at the custodian. Cross-system join key to FSC advisor."
      - name: branch_code
        description: "Custodian branch code for the office servicing this account"
      - name: status
        description: "Account lifecycle status at the custodian: Open, Closed, or Restricted"
      - name: date_opened
        description: "Date the account was opened at the custodian"
      - name: date_closed
        description: "Date the account was closed at the custodian. NULL for open accounts."
      - name: margin_approved
        description: "Whether margin trading is approved for this account (true/false)"
      - name: options_level
        description: "Approved options trading level (0-4). 0 = no options, 4 = full uncovered options."
      - name: loaded_at
        description: "Source system load timestamp from CUSTODIAN schema"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'CUSTODIAL_ACCOUNT'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
