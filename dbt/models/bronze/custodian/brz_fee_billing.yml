version: 2
models:
  - name: brz_fee_billing
    description: "Quarterly advisory fee calculations and debit records"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of fee_id)"
        tests: [unique, not_null]
      - name: fee_id
        description: "Fee record ID (natural key)"
        tests: [unique, not_null]
      - name: account_number
        tests:
          - not_null
          - relationships:
              to: ref('brz_custodial_account')
              field: account_number
      - name: fee_type
        tests:
          - accepted_values:
              values: ['Management Fee', 'Financial Planning']
      - name: status
        tests:
          - accepted_values:
              values: ['Calculated', 'Debited', 'Reversed']
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
