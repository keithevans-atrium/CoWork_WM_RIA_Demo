version: 2
models:
  - name: raw_position
    description: "Raw Custodian position records. Official custodian-reported security-level positions with quantities, prices, market values, and cost basis. Authoritative source for tax lot accounting and regulatory reporting."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from position_id"
        tests: [unique, not_null]
      - name: position_id
        description: "Custodian's unique position record identifier"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: as_of_date
        description: "Date the position snapshot was taken (typically end of business day)"
      - name: cusip
        description: "CUSIP identifier (9-character). Standard security identifier for clearing and settlement."
      - name: ticker
        description: "Exchange ticker symbol"
      - name: security_description
        description: "Custodian's description of the security"
      - name: security_type
        description: "Security classification: Equity, Fixed Income, ETF, Mutual Fund, Option, or Cash"
      - name: quantity
        description: "Number of shares or units held per custodian records"
      - name: price
        description: "Closing price per share/unit in USD as of as_of_date"
      - name: market_value
        description: "Total market value in USD (quantity * price)"
      - name: cost_basis
        description: "Aggregate cost basis in USD. Authoritative for tax reporting."
      - name: cost_basis_method
        description: "Tax lot accounting method: FIFO, Specific Lot, or Average Cost"
      - name: accrued_income
        description: "Accrued but unpaid income (dividends, interest) in USD"
      - name: loaded_at
        description: "Source system load timestamp from CUSTODIAN schema"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'POSITION'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
