version: 2
models:
  - name: raw_position
    description: "Daily security positions with pricing and cost basis"
    columns:
      - name: record_pk
        description: "Surrogate key (MD5 of position_id)"
        tests: [unique, not_null]
      - name: position_id
        description: "Position record ID (natural key)"
        tests: [unique, not_null]
      - name: account_number
        tests:
          - not_null
          - relationships:
              to: ref('raw_custodial_account')
              field: account_number
      - name: change_key
        description: "MD5 hash of all non-key columns for change detection"
        tests: [not_null]
