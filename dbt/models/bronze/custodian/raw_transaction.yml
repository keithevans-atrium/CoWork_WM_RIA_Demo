version: 2
models:
  - name: raw_transaction
    description: "Raw Custodian transaction records. Trade-level activity including buys, sells, dividends, interest, transfers, and fees. Authoritative source for trade confirmations and regulatory audit trail."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from transaction_id"
        tests: [unique, not_null]
      - name: transaction_id
        description: "Custodian's unique transaction identifier"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: trade_date
        description: "Date the trade was executed (T)"
      - name: settle_date
        description: "Date the trade settles (typically T+1 for equities)"
      - name: transaction_type
        description: "Activity type: Buy, Sell, Dividend, Interest, Fee, Transfer In, or Transfer Out"
      - name: cusip
        description: "CUSIP identifier of the security traded"
      - name: ticker
        description: "Exchange ticker symbol of the security traded"
      - name: security_description
        description: "Description of the security traded"
      - name: quantity
        description: "Number of shares/units transacted. Positive for buys, negative for sells."
      - name: price
        description: "Execution price per share/unit in USD"
      - name: gross_amount
        description: "Total gross transaction amount in USD before commissions and fees"
      - name: net_amount
        description: "Net transaction amount in USD after commissions and fees"
      - name: commission
        description: "Commission charged on the transaction in USD"
      - name: fees
        description: "Additional fees (SEC, TAF, exchange) in USD"
      - name: cancel_status
        description: "Cancellation indicator: NULL for normal trades, 'CANCELLED' for reversed trades"
      - name: loaded_at
        description: "Source system load timestamp from CUSTODIAN schema"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Timestamp when this record was loaded into the bronze layer"
      - name: _record_source
        description: "Source table name: 'TRANSACTION'"
      - name: change_key
        description: "MD5 hash of all non-key business columns for SCD2 change detection"
        tests: [not_null]
