version: 2
models:
  - name: stg_perf_portfolio_return
    description: "Staged SCD2 history of Performance System portfolio return records. Tracks historical return snapshots across multiple periods with benchmark comparisons."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from return_id"
        tests: [not_null]
      - name: return_id
        description: "Unique return record identifier"
      - name: account_number
        description: "Custodian-assigned account number"
      - name: portfolio_id
        description: "Portfolio identifier"
      - name: as_of_date
        description: "Reporting date for this return snapshot"
      - name: mtd_return
        description: "Month-to-date return as a decimal"
      - name: qtd_return
        description: "Quarter-to-date return as a decimal"
      - name: ytd_return
        description: "Year-to-date return as a decimal"
      - name: itd_return
        description: "Inception-to-date return as a decimal"
      - name: one_year_return
        description: "Trailing one-year annualized return"
      - name: three_year_return
        description: "Trailing three-year annualized return"
      - name: five_year_return
        description: "Trailing five-year annualized return"
      - name: benchmark_id
        description: "Assigned benchmark identifier"
      - name: benchmark_mtd_return
        description: "Benchmark month-to-date return"
      - name: benchmark_ytd_return
        description: "Benchmark year-to-date return"
      - name: benchmark_one_year_return
        description: "Benchmark trailing one-year return"
      - name: return_method
        description: "Calculation methodology: TWR or MWR"
      - name: loaded_at
        description: "Source system load timestamp"
      - name: _source_system
        description: "Source system identifier: 'performance_system'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'PORTFOLIO_RETURN'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
