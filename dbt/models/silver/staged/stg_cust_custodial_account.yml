version: 2
models:
  - name: stg_cust_custodial_account
    description: "Staged SCD2 history of Custodian account records. Tracks historical changes to registration, rep codes, margin approvals, and options levels."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from custodial_account_id"
        tests: [not_null]
      - name: custodial_account_id
        description: "Custodian's internal account identifier"
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: account_title
        description: "Legal account title on custodian records"
      - name: registration_type
        description: "Legal registration: Individual, Joint, Trust, or Custodial"
      - name: tax_id_last_four
        description: "Last four digits of tax ID"
      - name: custodian_code
        description: "Custodian identifier: SCHWAB, PERSHING, or FIDELITY"
      - name: rep_code
        description: "Advisor representative code at the custodian"
      - name: branch_code
        description: "Custodian branch code"
      - name: status
        description: "Account status: Open, Closed, or Restricted"
      - name: date_opened
        description: "Date the account was opened"
      - name: date_closed
        description: "Date the account was closed. NULL for open accounts."
      - name: margin_approved
        description: "Whether margin trading is approved"
      - name: options_level
        description: "Approved options trading level (0-4)"
      - name: loaded_at
        description: "Source system load timestamp"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'CUSTODIAL_ACCOUNT'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
