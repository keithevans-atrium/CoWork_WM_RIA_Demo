version: 2
models:
  - name: stg_fsc_advisor
    description: "Staged SCD2 history of Salesforce FSC Advisor records. Tracks historical changes to advisor details — roles, branch assignments, CRD numbers, and employment status."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from advisor_id"
        tests: [not_null]
      - name: advisor_id
        description: "Salesforce User ID for the advisor"
      - name: first_name
        description: "Advisor's first/given name"
      - name: last_name
        description: "Advisor's last/family name"
      - name: advisor_name
        description: "Concatenated first_name + last_name"
      - name: email
        description: "Business email address"
      - name: phone
        description: "Business phone number"
      - name: role
        description: "Functional role: Lead Advisor, Associate Advisor, or Paraplanner"
      - name: crd_number
        description: "FINRA CRD number"
      - name: rep_code
        description: "Custodian-assigned representative code"
      - name: branch_name
        description: "Office branch"
      - name: manager_id
        description: "Salesforce User ID of the advisor's manager"
      - name: is_active
        description: "Whether the advisor is currently active"
      - name: hire_date
        description: "Date the advisor joined the firm"
      - name: termination_date
        description: "Date the advisor left the firm. NULL for active advisors."
      - name: created_date
        description: "Salesforce record creation timestamp"
      - name: last_modified_date
        description: "Salesforce last modification timestamp"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'ADVISOR'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
