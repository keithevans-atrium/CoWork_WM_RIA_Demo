version: 2
models:
  - name: stg_fsc_contact
    description: "Staged SCD2 history of Salesforce FSC Contact records. Tracks all historical versions of client demographics, employment, and risk profiles with version numbering."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from contact_id"
        tests: [not_null]
      - name: contact_id
        description: "Salesforce 18-character Contact ID"
      - name: account_id
        description: "Salesforce Account ID of the owning client household"
      - name: first_name
        description: "Contact's first/given name"
      - name: last_name
        description: "Contact's last/family name"
      - name: full_name
        description: "Concatenated first_name + last_name"
      - name: email
        description: "Personal email address"
      - name: phone
        description: "Primary phone number"
      - name: mobile_phone
        description: "Mobile phone number"
      - name: mailing_state
        description: "Two-letter US state code from mailing address"
      - name: mailing_city
        description: "City from the mailing address"
      - name: mailing_zip
        description: "ZIP/postal code from the mailing address"
      - name: date_of_birth
        description: "Contact's date of birth"
      - name: ssn_last_four
        description: "Last four digits of SSN"
      - name: employment_status
        description: "Employment status: Employed, Self-Employed, Retired, or Business Owner"
      - name: employer_name
        description: "Name of current employer"
      - name: occupation
        description: "Professional occupation"
      - name: risk_tolerance
        description: "Stated risk tolerance: Conservative, Moderate, Moderate Growth, Growth, or Aggressive"
      - name: investment_experience
        description: "Investment knowledge: Beginner, Intermediate, Experienced, or Sophisticated"
      - name: is_primary_contact
        description: "Whether this is the primary contact for the account"
      - name: created_date
        description: "Salesforce record creation timestamp"
      - name: last_modified_date
        description: "Salesforce last modification timestamp"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'CONTACT'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag. True if source record was deleted."
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version (not expired, not deleted)"
