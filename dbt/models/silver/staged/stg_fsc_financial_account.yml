version: 2
models:
  - name: stg_fsc_financial_account
    description: "Staged SCD2 history of Salesforce FSC Financial Account records. Tracks historical changes to investment account details — types, balances, model assignments, and fee rates."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from financial_account_id"
        tests: [not_null]
      - name: financial_account_id
        description: "Salesforce Financial Account ID"
      - name: account_id
        description: "Salesforce Account ID of the owning client"
      - name: contact_id
        description: "Salesforce Contact ID of the primary account holder"
      - name: financial_account_name
        description: "Display name of the financial account"
      - name: financial_account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: account_type
        description: "Investment account type: Brokerage, Traditional IRA, Roth IRA, SEP IRA, 401k Rollover, or Trust"
      - name: registration_type
        description: "Legal registration: Individual, Joint, Trust, or Custodial"
      - name: custodian_name
        description: "Custodian name: Schwab, Pershing, or Fidelity"
      - name: status
        description: "Account lifecycle status: Open, Closed, or Pending"
      - name: balance
        description: "Current account balance in USD"
      - name: inception_date
        description: "Date the account was originally opened"
      - name: close_date
        description: "Date the account was closed. NULL for open accounts."
      - name: model_portfolio
        description: "Assigned model portfolio code"
      - name: management_fee_rate
        description: "Annual advisory fee rate as a decimal"
      - name: is_discretionary
        description: "Whether the advisor has discretionary trading authority"
      - name: created_date
        description: "Salesforce record creation timestamp"
      - name: last_modified_date
        description: "Salesforce last modification timestamp"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'FINANCIAL_ACCOUNT'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
