version: 2
models:
  - name: stg_cust_position
    description: "Staged SCD2 history of Custodian position records. Tracks historical security-level positions with quantities, prices, market values, and cost basis over time."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from position_id"
        tests: [not_null]
      - name: position_id
        description: "Custodian's unique position record identifier"
      - name: account_number
        description: "Custodian-assigned account number"
      - name: as_of_date
        description: "Date the position snapshot was taken"
      - name: cusip
        description: "CUSIP identifier (9-character)"
      - name: ticker
        description: "Exchange ticker symbol"
      - name: security_description
        description: "Custodian's description of the security"
      - name: security_type
        description: "Security classification: Equity, Fixed Income, ETF, Mutual Fund, Option, or Cash"
      - name: quantity
        description: "Number of shares or units held"
      - name: price
        description: "Closing price per share/unit in USD"
      - name: market_value
        description: "Total market value in USD"
      - name: cost_basis
        description: "Aggregate cost basis in USD"
      - name: cost_basis_method
        description: "Tax lot accounting method: FIFO, Specific Lot, or Average Cost"
      - name: accrued_income
        description: "Accrued but unpaid income in USD"
      - name: loaded_at
        description: "Source system load timestamp"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'POSITION'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
