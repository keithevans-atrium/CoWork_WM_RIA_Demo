version: 2
models:
  - name: stg_perf_benchmark
    description: "Staged SCD2 history of Performance System benchmark reference records. Tracks changes to benchmark definitions, types, and active status over time."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from benchmark_id"
        tests: [not_null]
      - name: benchmark_id
        description: "Unique benchmark identifier"
      - name: benchmark_name
        description: "Full name of the benchmark"
      - name: benchmark_ticker
        description: "Ticker symbol for the benchmark index"
      - name: benchmark_type
        description: "Classification: Equity, Fixed Income, Balanced, or Specialty"
      - name: asset_class
        description: "Primary asset class the benchmark represents"
      - name: is_active
        description: "Whether the benchmark is currently in use"
      - name: _source_system
        description: "Source system identifier: 'performance_system'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'BENCHMARK'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
