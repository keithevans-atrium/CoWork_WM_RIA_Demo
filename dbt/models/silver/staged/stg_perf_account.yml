version: 2
models:
  - name: stg_perf_account
    description: "Staged SCD2 history of Performance System account records. Tracks changes to portfolio assignments, model allocations, market values, and fee schedules over time."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from account_number"
        tests: [not_null]
      - name: account_number
        description: "Custodian-assigned account number. Cross-system join key."
      - name: account_name
        description: "Display name of the account in the performance system"
      - name: portfolio_id
        description: "Unique portfolio identifier"
      - name: registration_type
        description: "Legal registration type"
      - name: inception_date
        description: "Date the account was opened"
      - name: close_date
        description: "Date the account was closed. NULL for open accounts."
      - name: status
        description: "Account status: Active, Closed, or Pending"
      - name: model_id
        description: "Assigned model portfolio identifier"
      - name: advisor_code
        description: "Advisor rep code in the performance system"
      - name: custodian_code
        description: "Custodian identifier: SCHWAB, PERSHING, or FIDELITY"
      - name: fee_schedule
        description: "Fee schedule code for billing rate tier"
      - name: is_discretionary
        description: "Whether the account has discretionary management"
      - name: total_market_value
        description: "Total account market value in USD"
      - name: as_of_date
        description: "Date the market value was last computed"
      - name: loaded_at
        description: "Source system load timestamp"
      - name: _source_system
        description: "Source system identifier: 'performance_system'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'PERFORMANCE_ACCOUNT'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
