version: 2
models:
  - name: stg_cust_fee_billing
    description: "Staged SCD2 history of Custodian fee billing records. Tracks historical advisory fee calculations per billing period with status changes from calculated through debited."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from fee_id"
        tests: [not_null]
      - name: fee_id
        description: "Custodian's unique fee billing record identifier"
      - name: account_number
        description: "Custodian-assigned account number"
      - name: billing_period_start
        description: "Start date of the billing period"
      - name: billing_period_end
        description: "End date of the billing period"
      - name: fee_type
        description: "Type of fee: Management, Performance, Financial Planning, or Custody"
      - name: billable_aum
        description: "AUM used as the fee calculation base in USD"
      - name: fee_rate
        description: "Annualized fee rate as a decimal"
      - name: fee_amount
        description: "Calculated fee amount in USD"
      - name: debit_date
        description: "Date the fee was or will be debited"
      - name: status
        description: "Billing status: Calculated, Debited, or Reversed"
      - name: loaded_at
        description: "Source system load timestamp"
      - name: _source_system
        description: "Source system identifier: 'custodian'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'FEE_BILLING'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
