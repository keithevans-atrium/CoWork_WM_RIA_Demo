version: 2
models:
  - name: stg_fsc_advisor_team
    description: "Staged SCD2 history of Salesforce FSC Advisor Team records. Tracks historical changes to team composition, leadership, and regional assignments."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from team_id"
        tests: [not_null]
      - name: team_id
        description: "Salesforce Team ID"
      - name: team_name
        description: "Display name of the team"
      - name: team_lead_advisor_id
        description: "Salesforce Advisor ID of the team lead"
      - name: branch_name
        description: "Branch office associated with the team"
      - name: region
        description: "Geographic region: West, East, Central, or Southeast"
      - name: is_active
        description: "Whether the team is currently active"
      - name: created_date
        description: "Salesforce record creation timestamp"
      - name: last_modified_date
        description: "Salesforce last modification timestamp"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'ADVISOR_TEAM'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for current version."
      - name: dbt_is_deleted
        description: "Hard-delete flag"
      - name: version_number
        description: "Sequential version counter per record_pk (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version"
