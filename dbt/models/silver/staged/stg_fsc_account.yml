version: 2
models:
  - name: stg_fsc_account
    description: "Staged SCD2 history of Salesforce FSC Account records. Adds version tracking (version_number, is_current) on top of the raw_account snapshot. Each row represents one version of an account record."
    columns:
      - name: record_pk
        description: "MD5 surrogate key generated from account_id. Shared across all versions of the same account."
        tests: [not_null]
      - name: account_id
        description: "Salesforce 18-character Account ID"
      - name: account_name
        description: "Display name of the account"
      - name: account_type
        description: "Entity classification: Individual, Household, Joint, Trust, or Business"
      - name: record_type
        description: "Salesforce record type controlling page layout"
      - name: advisor_id
        description: "Salesforce ID of the assigned advisor"
      - name: parent_account_id
        description: "Salesforce ID of parent account for hierarchy rollups"
      - name: financial_account_count
        description: "Count of financial accounts linked to this client"
      - name: aum
        description: "Assets Under Management in USD"
      - name: billing_state
        description: "Two-letter US state code from billing address"
      - name: billing_city
        description: "City from the billing address"
      - name: billing_zip
        description: "ZIP/postal code from the billing address"
      - name: phone
        description: "Primary phone number"
      - name: email
        description: "Primary email address"
      - name: client_segment
        description: "Wealth tier: UHNW, HNW, Mass Affluent, or Emerging"
      - name: service_model
        description: "Service delivery model: Full Service, Advisory, Digital, or Hybrid"
      - name: relationship_start_date
        description: "Date the client relationship began"
      - name: is_active
        description: "Whether the account is currently active"
      - name: created_date
        description: "Timestamp when the record was created in Salesforce"
      - name: last_modified_date
        description: "Timestamp of the most recent modification in Salesforce"
      - name: _source_system
        description: "Source system identifier: 'salesforce_fsc'"
      - name: _loaded_at
        description: "Bronze layer load timestamp"
      - name: _record_source
        description: "Source table name: 'ACCOUNT'"
      - name: change_key
        description: "MD5 hash of business columns for change detection"
      - name: dbt_scd_id
        description: "dbt-generated unique ID for this SCD2 version row"
      - name: dbt_updated_at
        description: "Timestamp when this snapshot version was captured"
      - name: dbt_valid_from
        description: "Start of the validity window for this version"
      - name: dbt_valid_to
        description: "End of the validity window. NULL for the current active version."
      - name: dbt_is_deleted
        description: "Hard-delete flag. True if the source record was deleted."
      - name: version_number
        description: "Sequential version counter per record_pk, ascending by dbt_valid_from (1 = first version)"
      - name: reverse_version_number
        description: "Reverse-ordered version counter (1 = most recent version)"
      - name: is_current
        description: "True if this is the active version (dbt_valid_to IS NULL and not deleted)"
