version: 2
models:
  - name: position
    description: "Canonical position entity - holdings enriched with custodian pricing and benchmark"
    columns:
      - name: holding_id
        description: "Holdings natural key"
        tests: [not_null]
      - name: account_number
        description: "Account number (cross-system join key)"
        tests: [not_null]
      - name: ticker
        tests: [not_null]
      - name: market_value
        description: "Current market value of the position"
      - name: unrealized_gain_loss
        description: "Unrealized P&L (market value - cost basis)"
