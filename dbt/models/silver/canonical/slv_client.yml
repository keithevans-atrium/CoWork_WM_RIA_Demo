version: 2
models:
  - name: slv_client
    description: "Canonical client entity - FSC account + primary contact + advisor + team"
    columns:
      - name: account_id
        description: "Client natural key (FSC Account ID)"
        tests: [unique, not_null]
      - name: primary_contact_name
        description: "Full name of primary contact"
      - name: advisor_name
        description: "Assigned advisor full name"
      - name: team_name
        description: "Advisor team name"
      - name: client_segment
        tests:
          - accepted_values:
              values: ['UHNW', 'HNW', 'Mass Affluent', 'Emerging']
