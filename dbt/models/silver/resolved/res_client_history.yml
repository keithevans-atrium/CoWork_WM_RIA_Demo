version: 2
models:
  - name: res_client_history
    description: "SCD2 history for client - tracks segment, service model, risk tolerance, state, active status"
    columns:
      - name: client_history_id
        tests: [unique, not_null]
      - name: client_id
        tests: [not_null]
      - name: version_number
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
