version: 2
models:
  - name: res_client_advisor
    description: "Resolved client-to-advisor relationship. Temporal M:N mapping between clients and advisors. Tracks primary vs secondary advisor assignments with effective dating for book transfers."
    columns:
      - name: client_advisor_id
        description: "Surrogate key for this client-advisor relationship"
        tests: [unique, not_null]
      - name: client_id
        description: "Salesforce Account ID of the client"
      - name: advisor_id
        description: "Salesforce User ID of the advisor"
      - name: relationship_type
        description: "Type of advisor relationship: Primary Advisor, Secondary Advisor, or Specialist"
      - name: is_primary
        description: "Whether this is the primary advisor for the client"
      - name: effective_from
        description: "Start date of this advisor assignment"
      - name: effective_to
        description: "End date. NULL for current assignments."
      - name: is_current
        description: "True if this assignment is currently active"
      - name: resolved_at
        description: "Timestamp when resolution was computed"
