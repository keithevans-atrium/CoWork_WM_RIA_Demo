version: 2
models:
  - name: res_position_history
    description: "SCD2 history for positions - tracks quantity, market value, cost basis, unrealized P&L"
    columns:
      - name: position_history_id
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: security_id
        tests: [not_null]
      - name: version_number
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
