version: 2
models:
  - name: res_fee_detail
    description: "Attribution-resolved fee detail entity. Reconciles Custodian fee billing records with FSC fee rates and account names. Exposes each system's fee type, rate, and amount alongside resolved golden values."
    columns:
      - name: fee_id
        description: "Custodian's fee billing record identifier"
        tests: [unique, not_null]
      - name: account_number
        description: "Custodian account number"
      - name: cust_fee_type
        description: "Fee type from Custodian"
      - name: resolved_fee_type
        description: "Golden fee type"
      - name: cust_fee_rate
        description: "Fee rate from Custodian"
      - name: fsc_fee_rate
        description: "Management fee rate from FSC"
      - name: resolved_fee_rate
        description: "Golden fee rate: coalesce(cust, fsc)"
      - name: cust_fee_amount
        description: "Fee amount from Custodian"
      - name: resolved_fee_amount
        description: "Golden fee amount"
      - name: cust_billable_aum
        description: "Billable AUM from Custodian"
      - name: resolved_billable_aum
        description: "Golden billable AUM"
      - name: billing_period_start
        description: "Start date of the billing period"
      - name: billing_period_end
        description: "End date of the billing period"
      - name: debit_date
        description: "Date the fee was/will be debited"
      - name: cust_fee_status
        description: "Fee status from Custodian"
      - name: resolved_fee_status
        description: "Golden fee status"
      - name: cust_custodian_code
        description: "Custodian code"
      - name: cust_rep_code
        description: "Advisor rep code from Custodian"
      - name: sfdc_account_id
        description: "Linked Salesforce Account ID"
      - name: fsc_account_name
        description: "Client account name from FSC"
      - name: fsc_custodian_name
        description: "Custodian name from FSC"
      - name: client_segment
        description: "Client wealth tier from FSC"
      - name: advisor_id
        description: "Linked advisor's Salesforce ID"
      - name: match_status
        description: "Cross-system linkage quality"
      - name: resolved_at
        description: "Timestamp when resolution was computed"
