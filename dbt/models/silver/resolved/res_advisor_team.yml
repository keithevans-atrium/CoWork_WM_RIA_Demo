version: 2
models:
  - name: res_advisor_team
    description: "Resolved advisor-to-team relationship. Temporal M:N mapping between advisors and teams. Tracks role within team (Lead, Member, Support) with effective dating."
    columns:
      - name: advisor_team_id
        description: "Surrogate key for this advisor-team relationship"
        tests: [unique, not_null]
      - name: advisor_id
        description: "Salesforce User ID of the advisor"
      - name: team_id
        description: "Salesforce Team ID"
      - name: role_in_team
        description: "Advisor's role within the team: Lead, Member, or Support"
      - name: effective_from
        description: "Start date of this team membership"
      - name: effective_to
        description: "End date. NULL for current memberships."
      - name: is_current
        description: "True if this membership is currently active"
      - name: resolved_at
        description: "Timestamp when resolution was computed"
