version: 2
models:
  - name: res_advisor_team
    description: "Relationship: which advisor belongs to which team (temporal)"
    columns:
      - name: advisor_team_id
        tests: [unique, not_null]
      - name: advisor_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]
