version: 2
models:
  - name: res_account_model
    description: "Relationship: which account follows which model portfolio (temporal)"
    columns:
      - name: account_model_id
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: model_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]
