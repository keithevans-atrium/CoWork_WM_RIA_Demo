version: 2
models:
  - name: res_client_account
    description: "Relationship: which client owns which account (temporal)"
    columns:
      - name: client_account_id
        tests: [unique, not_null]
      - name: client_id
        tests: [not_null]
      - name: account_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]
