version: 2
models:
  - name: res_model_portfolio
    description: "Attribution resolution for model portfolio - Performance system only (single source)"
    columns:
      - name: model_id
        tests: [unique, not_null]
      - name: resolved_model_name
        tests: [not_null]
      - name: match_status
        tests:
          - accepted_values:
              values: ['PERF_ONLY']
      - name: resolved_at
        tests: [not_null]
