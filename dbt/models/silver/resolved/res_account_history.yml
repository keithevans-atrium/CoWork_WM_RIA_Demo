version: 2
models:
  - name: res_account_history
    description: "SCD2 history for account - tracks market value, status, fee schedule, model assignment"
    columns:
      - name: account_history_id
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: version_number
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
