version: 2
models:
  - name: res_advisor_history
    description: "SCD2 history for advisor - tracks role, rep_code, branch, active status"
    columns:
      - name: advisor_history_id
        tests: [unique, not_null]
      - name: advisor_id
        tests: [not_null]
      - name: version_number
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
